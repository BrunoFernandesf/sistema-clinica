<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Sistema Clínica</h1>

    <nav>
        <a href="index.html">Pacientes</a>
        <a href="medicos.html">Médicos</a>
        <a href="especialidades.html">Especialidades</a>
    </nav>

    <p class="subtitulo">Cadastro de Especialidades</p>

    <div class="linha-destaque"></div>

    <form id="form-especialidade">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <div class="linha-campos">
            <div>
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" required>
            </div>

        </div>

        <button type="submit">Cadastrar</button>
    </form>

    <details>
        <summary>Especialidades cadastradas</summary>

        <div id="lista-especialidades"></div>
    </details>

    <script src="js/especialidades.js"></script>
</body>
</html>
