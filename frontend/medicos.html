<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Sistema Clínica</h1>

    <nav>
        <a href="index.html">Pacientes</a>
    </nav>

    <p class="subtitulo">Cadastro de Medicos</p>

    <div class="linha-destaque"></div>

    <form id="form-medico">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <div class="linha-campos">
            <div>
                <label for="crm">CRM</label>
                <input type="text" id="crm" name="crm" required>
            </div>

        </div>
        
        <div class="linha-campos">
            <div>
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

        </div>

        <label for="especialidade">Especialidade</label>
        <input type="text" id="especialidade" name="especialidade" required>

        <button type="submit">Cadastrar</button>
    </form>

    <details>
        <summary>Medicos cadastrados</summary>

        <div id="lista-medicos"></div>
    </details>

    <script src="js/medicos.js"></script>
</body>
</html>
